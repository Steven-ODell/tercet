# Builds one standalone binary per platform on a native runner when a v* tag is pushed, checks that
# each starts, then publishes them with a SHA256SUMS file on the GitHub release. The release notes
# are the annotated tag's message, which scripts/release fills in (including the T3 versions this
# build was tested against). Nothing here runs on branches or pull requests.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-latest }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: windows-x64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: the tag matches package.json
        run: |
          want="v$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$want" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} but package.json says $want" >&2
            exit 1
          fi
      - run: bun scripts/build-binary --out out
      - name: the binary starts and names its T3 versions
        run: |
          bin=$(ls out/tercet-*)
          "$bin" --version
          "$bin" list --help
          "$bin" tmux --help
      - uses: actions/upload-artifact@v4
        with:
          name: tercet-${{ matrix.target }}
          path: out/tercet-*
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: tercet-*
          merge-multiple: true
      - name: checksums
        run: |
          cd assets
          chmod +x tercet-* || true
          sha256sum tercet-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/checkout@v5
        with:
          path: repo
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd repo
          # actions/checkout leaves a lightweight ref; fetch the annotated tag object for its message.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" ../assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" ../assets/* --verify-tag --notes-from-tag --title "tercet ${GITHUB_REF_NAME#v}"
          fi
